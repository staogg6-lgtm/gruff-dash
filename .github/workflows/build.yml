name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # Your AdMob APP ID. Set it in GitHub: Settings > Secrets and variables > Actions > Variables > ADMOB_APP_ID.
  # Until you do, Google's public TEST app ID is used (test ads only, no money).
  ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icons (skipped if it fails)
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Lock portrait and add the AdMob app ID
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' $M
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" $M
          grep -c APPLICATION_ID $M

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gruff-dash-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
